name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Viettel-only defconfig
        run: bash scripts/verify-viettel-config.sh defconfig/viettel-only.config

      - name: Check fork automation scripts
        run: bash -n scripts/build-viettel.sh scripts/prepare-build.sh scripts/verify-viettel-config.sh scripts/verify-viettel-artifacts.sh scripts/generate-release-notes.sh
